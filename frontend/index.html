<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>MinePlan Control · BEMISA</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><path d='M4 26 L13 10 L18 18 L21 14 L28 26 Z' fill='%23c8742c'/></svg>">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <header class="topo">
    <div class="marca">
      <svg viewBox="0 0 32 32" aria-hidden="true"><path d="M4 26 L13 10 L18 18 L21 14 L28 26 Z"/></svg>
      <div>
        <strong>MinePlan Control</strong>
        <span>Planejamento semanal de lavra · BEMISA</span>
      </div>
    </div>
    <nav class="abas" aria-label="Seções">
      <a href="#/painel" data-rota="painel">Painel</a>
      <a href="#/gantt" data-rota="gantt">Cronograma</a>
      <a href="#/atividades" data-rota="atividades">Atividades</a>
      <a href="#/equipamentos" data-rota="equipamentos">Equipamentos</a>
      <a href="#/importar" data-rota="importar">Importar</a>
    </nav>
  </header>

  <section class="barra-periodo" aria-label="Período">
    <div class="periodo">
      <button class="btn icone" id="sem-ant" title="Semana anterior" aria-label="Semana anterior">‹</button>
      <label class="campo-semana">
        <span>Semana</span>
        <input type="week" id="semana">
      </label>
      <button class="btn icone" id="sem-prox" title="Próxima semana" aria-label="Próxima semana">›</button>
      <button class="btn texto" id="sem-atual">Semana atual</button>
      <label class="chk"><input type="checkbox" id="todas"> Todas as datas</label>
      <span class="intervalo" id="intervalo"></span>
    </div>
    <div class="periodo">
      <label class="campo-semana">
        <span>Referência</span>
        <input type="date" id="data-ref" title="Data usada para calcular atrasos e aderência">
      </label>
      <a class="btn" id="exportar" href="#" download>⇩ Exportar Excel</a>
    </div>
  </section>

  <main id="conteudo" tabindex="-1"></main>

  <div id="toasts" aria-live="polite"></div>
  <dialog id="modal"></dialog>
  <div id="tooltip" role="tooltip" hidden></div>

  <script type="module" src="js/app.js"></script>
</body>
</html>
